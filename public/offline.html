<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | ourCloset</title>
  <style>
    :root {
      --raw-silk: #FAF8F5;
      --charcoal: #1C1B1F;
      --primary: #3D3231;
      --secondary: #B8935A;
      --surface-lowest: #FFFFFF;
      --border: rgba(61, 50, 49, 0.15);
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--raw-silk);
      color: var(--charcoal);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--surface-lowest);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin: 0 0 0.75rem 0;
      font-weight: 700;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 2rem 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary);
      color: var(--raw-silk);
    }
    .btn-outline {
      border: 1px solid var(--border);
      color: var(--primary);
      background: transparent;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧺</div>
    <div class="badge">Offline App Shell</div>
    <h1>You're Offline</h1>
    <p>ourCloset runs client-side with 100% private local storage. Your wardrobe items, cached outfits, and laundry board remain fully accessible while disconnected.</p>
    <div class="btn-group">
      <a href="/today" class="btn btn-primary">Open Today's Outfits</a>
      <a href="/closet" class="btn btn-outline">Browse Cached Wardrobe</a>
      <a href="/laundry" class="btn btn-outline">Check Laundry Board</a>
    </div>
  </div>
</body>
</html>
